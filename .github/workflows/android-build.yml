name: Android Build

concurrency:
  group: pocketqwen-android-build-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - fix/ui-stabilization-v1
      - feat/chat-sidebar-native-inference
      - perf/arm-inference-diagnostics
      - experiment/termux-style-native
      - experiment/termux-runtime-backend
      - experiment-3
      - experiment-4
      - feature/experiment-5-performance-settings
      - feature/experiment-5-ui-improvements
      - release/ekip-play-readiness
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test PocketQwen APK
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses and install required packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools" "ndk;29.0.14206865" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.11.1

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Fetch pinned llama.cpp native engine
        run: |
          git clone https://github.com/ggml-org/llama.cpp.git app/src/main/cpp/llama.cpp
          git -C app/src/main/cpp/llama.cpp checkout 9125a2ebe8e5a38f0f4232170c134a29ed730b66

      - name: Download bundled Qwen2.5-0.5B-Instruct model
        run: |
          mkdir -p app/src/main/assets
          curl --fail --location --retry 5 --retry-all-errors "https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf" --output app/src/main/assets/qwen.gguf
          echo "74a4da8c9fdbcd15bd1f6d01d621410d31c6fc00986f5eb687824e7b93d7a9db  app/src/main/assets/qwen.gguf" | sha256sum --check
          ls -lh app/src/main/assets/qwen.gguf

      - name: Report Termux-parity native build settings
        run: |
          echo "Experiment branch: $GITHUB_REF_NAME"
          echo "llama.cpp revision: 9125a2ebe8e5a38f0f4232170c134a29ed730b66"
          echo "Expected target-safe parity: Release/-O3, GGML_NATIVE=OFF (required for NDK cross-compile), GGML_OPENMP=ON, GGML_CPU_KLEIDIAI=OFF, GGML_LLAMAFILE=ON, LLAMA_OPENSSL=OFF"
          grep -nE 'GGML_NATIVE|GGML_OPENMP|GGML_CPU_KLEIDIAI|GGML_LLAMAFILE|LLAMA_OPENSSL|GGML_VULKAN' app/src/main/cpp/CMakeLists.txt
          echo "NDK: $ANDROID_HOME/ndk/29.0.14206865"
          grep -m1 'Pkg.Revision' "$ANDROID_HOME/ndk/29.0.14206865/source.properties"

      - name: Build optimized release and installable debug APKs
        run: ./gradlew assembleRelease assembleDebug --no-daemon --stacktrace

      - name: Verify release APK signature, alignment, bundled model, and ABI
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          ZIPALIGN="$ANDROID_HOME/build-tools/36.0.0/zipalign"

          test -s "$APK_PATH"
          if [[ "$APK_PATH" == *unsigned* ]]; then
            echo "::error::Refusing to publish an unsigned APK."
            exit 1
          fi

          echo "APK size:"
          stat -c '%n %s bytes' "$APK_PATH"
          du -h "$APK_PATH"

          echo "Checking APK alignment..."
          "$ZIPALIGN" -c -v 4 "$APK_PATH"

          echo "Verifying APK signature and printing certificate..."
          "$APKSIGNER" verify --verbose --print-certs "$APK_PATH"

          echo "Checking bundled GGUF model..."
          unzip -Z1 "$APK_PATH" | grep -Fx 'assets/qwen.gguf'

          echo "Checking native ABI..."
          unzip -Z1 "$APK_PATH" | grep -E '^lib/arm64-v8a/[^/]+\\.so
        if: always()
        run: |
          mkdir -p native-build-diagnostics
          find app/.cxx -type f -name CMakeCache.txt -print 2>/dev/null | tee native-build-diagnostics/cmake-cache-paths.txt || true
          while IFS= read -r cache; do
            [ -f "$cache" ] || continue
            {
              echo "===== $cache ====="
              grep -E '^(CMAKE_BUILD_TYPE|CMAKE_C_FLAGS_RELEASE|CMAKE_CXX_FLAGS_RELEASE|GGML_NATIVE|GGML_OPENMP|GGML_CPU_KLEIDIAI|GGML_LLAMAFILE|LLAMA_OPENSSL|GGML_VULKAN):' "$cache" || true
            } >> native-build-diagnostics/native-cmake-options.txt
          done < native-build-diagnostics/cmake-cache-paths.txt
          cat native-build-diagnostics/native-cmake-options.txt 2>/dev/null || true

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Upload verified, signed release APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pocketqwen-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload installable debug APK for device testing
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pocketqwen-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload native build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pocketqwen-native-build-diagnostics
          path: native-build-diagnostics/
          if-no-files-found: ignore

      - name: Upload build and test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
 | tee /tmp/pocketqwen-native-libs.txt
          test -s /tmp/pocketqwen-native-libs.txt
          echo "Verified ARM64 native libraries for Redmi A5."

      - name: Capture generated native CMake configuration
        if: always()
        run: |
          mkdir -p native-build-diagnostics
          find app/.cxx -type f -name CMakeCache.txt -print 2>/dev/null | tee native-build-diagnostics/cmake-cache-paths.txt || true
          while IFS= read -r cache; do
            [ -f "$cache" ] || continue
            {
              echo "===== $cache ====="
              grep -E '^(CMAKE_BUILD_TYPE|CMAKE_C_FLAGS_RELEASE|CMAKE_CXX_FLAGS_RELEASE|GGML_NATIVE|GGML_OPENMP|GGML_CPU_KLEIDIAI|GGML_LLAMAFILE|LLAMA_OPENSSL|GGML_VULKAN):' "$cache" || true
            } >> native-build-diagnostics/native-cmake-options.txt
          done < native-build-diagnostics/cmake-cache-paths.txt
          cat native-build-diagnostics/native-cmake-options.txt 2>/dev/null || true

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Upload optimized release APK artifact (unsigned unless protected signing secrets are configured)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pocketqwen-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload installable debug APK for device testing
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pocketqwen-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload native build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pocketqwen-native-build-diagnostics
          path: native-build-diagnostics/
          if-no-files-found: ignore

      - name: Upload build and test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
