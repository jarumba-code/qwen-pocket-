name: Android Build

concurrency:
  group: pocketqwen-android-build-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - fix/ui-stabilization-v1
      - feat/chat-sidebar-native-inference
      - perf/arm-inference-diagnostics
      - experiment/termux-style-native
      - experiment/termux-runtime-backend
      - experiment-3
      - experiment-4
      - feature/experiment-5-performance-settings
      - experiment/gemma-model-experiment-1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test optimized experiment APK
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses and install required packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" "platform-tools" "ndk;29.0.14206865" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Fetch pinned llama.cpp native engine
        run: |
          git clone https://github.com/ggml-org/llama.cpp.git app/src/main/cpp/llama.cpp
          git -C app/src/main/cpp/llama.cpp checkout 9125a2ebe8e5a38f0f4232170c134a29ed730b66

      - name: Download bundled Gemma 3 1B instruction model
        run: |
          mkdir -p app/src/main/assets
          curl --fail --location --retry 5 --retry-all-errors "https://huggingface.co/unsloth/gemma-3-1b-it-GGUF/resolve/main/gemma-3-1b-it-Q4_K_M.gguf" --output app/src/main/assets/qwen.gguf
          test "$(stat -c%s app/src/main/assets/qwen.gguf)" -gt 750000000
          ls -lh app/src/main/assets/qwen.gguf

      - name: Report Termux-parity native build settings
        run: |
          echo "Experiment branch: $GITHUB_REF_NAME"
          echo "llama.cpp revision: 9125a2ebe8e5a38f0f4232170c134a29ed730b66"
          echo "Expected target-safe parity: Release/-O3, GGML_NATIVE=OFF (required for NDK cross-compile), GGML_OPENMP=ON, GGML_CPU_KLEIDIAI=OFF, GGML_LLAMAFILE=ON, LLAMA_OPENSSL=OFF"
          grep -nE 'GGML_NATIVE|GGML_OPENMP|GGML_CPU_KLEIDIAI|GGML_LLAMAFILE|LLAMA_OPENSSL|GGML_VULKAN' app/src/main/cpp/CMakeLists.txt
          echo "NDK: $ANDROID_HOME/ndk/29.0.14206865"
          grep -m1 'Pkg.Revision' "$ANDROID_HOME/ndk/29.0.14206865/source.properties"

      - name: Build optimized release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Capture generated native CMake configuration
        if: always()
        run: |
          mkdir -p native-build-diagnostics
          find app/.cxx -type f -name CMakeCache.txt -print 2>/dev/null | tee native-build-diagnostics/cmake-cache-paths.txt || true
          while IFS= read -r cache; do
            [ -f "$cache" ] || continue
            {
              echo "===== $cache ====="
              grep -E '^(CMAKE_BUILD_TYPE|CMAKE_C_FLAGS_RELEASE|CMAKE_CXX_FLAGS_RELEASE|GGML_NATIVE|GGML_OPENMP|GGML_CPU_KLEIDIAI|GGML_LLAMAFILE|LLAMA_OPENSSL|GGML_VULKAN):' "$cache" || true
            } >> native-build-diagnostics/native-cmake-options.txt
          done < native-build-diagnostics/cmake-cache-paths.txt
          cat native-build-diagnostics/native-cmake-options.txt 2>/dev/null || true

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Verify APK metadata and signature
        run: |
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          echo "APK path: $APK"
          ls -lh "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | head -n 8
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK"

      - name: Install and launch APK on ARM64 Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: arm64-v8a
          profile: pixel_2
          emulator-boot-timeout: 900
          script: |
            APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
            echo "Installing $APK on Android emulator..."
            adb install -r "$APK"
            echo "Install succeeded. Launching app..."
            adb shell monkey -p com.pocketqwen.gemmaexperiment1 1
            sleep 10
            adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' || true
            adb logcat -d -t 2000 > emulator-logcat.txt
            if grep -E 'FATAL EXCEPTION|UnsatisfiedLinkError|INSTALL_FAILED' emulator-logcat.txt; then
              echo "Potential app startup/install failure found in logcat."
              exit 1
            fi

      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pocketqwen-gemma-emulator-diagnostics
          path: emulator-logcat.txt
          if-no-files-found: ignore

      - name: Upload optimized release APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pocketqwen-gemma-model-experiment-1-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload native build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pocketqwen-native-build-diagnostics
          path: native-build-diagnostics/
          if-no-files-found: ignore

      - name: Upload build and test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
