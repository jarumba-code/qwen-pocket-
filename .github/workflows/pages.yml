name: Publish EKIP website

on:
  push:
    branches:
      - feature/pocketqwen-8192-memory-web-gold
      - release/ekip-play-readiness
    paths:
      - index.html
      - privacy.html
      - terms.html
      - features.html
      - how-it-works.html
      - about.html
      - download.html
      - assets/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare site for project-page URL
        env:
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html privacy.html terms.html features.html how-it-works.html about.html download.html _site/
          cp -R assets _site/
          touch _site/.nojekyll
          python3 - <<'PY'
          import os
          from pathlib import Path

          base = "/" + os.environ["REPOSITORY_NAME"].strip("/") + "/"
          extensions = {".html", ".css", ".js"}
          for path in Path("_site").rglob("*"):
              if path.is_file() and path.suffix.lower() in extensions:
                  content = path.read_text(encoding="utf-8")
                  for attribute in ("href", "src", "action", "poster"):
                      content = content.replace(f'{attribute}="/', f'{attribute}="{base}')
                  content = content.replace("url(/", f"url({base}")
                  path.write_text(content, encoding="utf-8")
          PY
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
